<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Korean Vocabulary Extractor</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <main>

        <header class="header">
            <h1>한국어 Vocabulary Extractor</h1>

            <p class="subtitle">
                Turn Korean scripts and text into a vocabulary study list.
            </p>
        </header>

        <section class="input-card">

            <form method="POST">

                <textarea
                    name="korean_text"
                    placeholder="한국어 텍스트를 여기에 입력하세요..."
                    required
                >{{ user_input }}</textarea>

                <button type="submit">
                    Extract Vocabulary
                </button>

            </form>

        </section>

        {% if vocab_list %}

            <section class="results-card">

                <h2>Extracted Vocabulary</h2>

                <table>

                    <thead>
                        <tr>
                            <th>Vocabulary</th>
                            <th>Frequency</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for word, count in vocab_list %}

                            <tr>
                                <td class="vocab-word">
                                    {{ word }}
                                </td>

                                <td>
                                    <span class="frequency">
                                        {{ count }}
                                    </span>
                                </td>
                            </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </section>

        {% endif %}

    </main>

</body>
</html>
